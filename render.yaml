services:
  - type: web
    name: yance-bagua-engine
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/agent/personas
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZHIPU_API_KEY
        sync: false
      - key: ZHIPU_MODEL
        value: glm-4-flash
      - key: CORS_ORIGIN
        value: https://yance-bagua.surge.sh
      - key: JWT_SECRET
        sync: false
