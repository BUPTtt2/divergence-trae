# Cloudflare Workers — Vercel API 反向代理
# 国内访问 vercel.app 被 GFW 封锁，用 CF Workers 做代理
# 部署：cd worker && wrangler login && wrangler deploy

name = "yance-bagua-engine"
main = "src/index.js"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1
